; ETS2 DXGI Chain Loader 설정 파일
; ─────────────────────────────────────────────────────────────────────────────
; primary   : DXGI export를 먼저 찾을 DLL (없으면 secondary 사용)
; secondary : primary에 없을 때 찾을 DLL (없으면 system dxgi 사용)
; fallback  : 정보용 주석 (항상 system dxgi.dll)
;
; DLL 이름은 이 dxgi.dll(프록시)과 같은 폴더에 있어야 한다.
; 절대 경로 불가, 폴더 구분자 불가.

[chain]
primary=SnowyMoon.dll
secondary=ReShade64.dll
fallback=system
